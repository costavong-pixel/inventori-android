name: Android debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Run backend unit tests
        run: python3 -m unittest discover -s backend -p "test_*.py"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        env:
          ORG_GRADLE_PROJECT_INVENTORI_AI_BACKEND_URL: ${{ vars.INVENTORI_AI_BACKEND_URL || 'https://inventori-api.barndai.com' }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug testDebugUnitTest

      - name: Run Android emulator workflow checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inventori-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30
